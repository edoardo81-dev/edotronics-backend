# ============ APP ============
spring.application.name=P20250709_01_userorderdemo

# ============ DATASOURCE (MySQL) ============
spring.datasource.url=jdbc:mysql://localhost:3306/orderproduct?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ============ JPA / HIBERNATE ============
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============ SEED ============
app.seed.enabled=false

# ============ LOGGING (NO DEBUG / NO CONDITIONS REPORT) ============
debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO

# ============ DEVTOOLS OFF ============
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.devtools.add-properties=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
